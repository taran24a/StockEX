name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tradewise_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradewise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Initialize isolated smoke database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradewise_test
        run: npm run seed
      - name: Run API trade-flow smoke test
        env:
          SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradewise_test
        run: npm run test:smoke --workspace @tradewise/server
