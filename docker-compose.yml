services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradewise}
      POSTGRES_USER: ${POSTGRES_USER:-tradewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewise}
    ports:
      - "5432:5432"
    volumes:
      - tradewise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tradewise}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tradewise-local}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tradewise-minio:/data

volumes:
  tradewise-postgres:
  tradewise-minio:
