services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradewise}
      POSTGRES_USER: ${POSTGRES_USER:-tradewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewise}
    ports:
      - "5432:5432"
    volumes:
      - tradewise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tradewise}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-tradewise-local}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tradewise-minio:/data

volumes:
  tradewise-postgres:
  tradewise-minio:
